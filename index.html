<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make it easy – Classi</title>
<meta name="theme-color" content="#9a7bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one calm column, sticky header with tabs; borders only on what needs action (ore da coprire) */
:root{
  --bg:#ffffff; --surface:#f7f5fb; --line:#e6e0f0; --fg:#211b2e; --muted:#6c6482;
  --accent:#9a7bd6;
  --accent-soft:color-mix(in oklab,var(--accent) 14%,var(--bg));
  --accent-strong:color-mix(in oklab,var(--accent) 70%,#000);
  --ok:#2e8a57; --warn:#a8691a; --bad:#c03d4a;
  --inf:#b5652e; --pri:#2b7f86;
  --ok-soft:color-mix(in oklab,var(--ok) 13%,var(--bg));
  --warn-soft:color-mix(in oklab,var(--warn) 14%,var(--bg));
  --inf-soft:color-mix(in oklab,var(--inf) 14%,var(--bg));
  --pri-soft:color-mix(in oklab,var(--pri) 14%,var(--bg));
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121c;--surface:#1f1a29;--line:#332c42;--fg:#f0ebf8;--muted:#a79fbc;
  --accent-strong:color-mix(in oklab,var(--accent) 62%,#fff);
  --ok:#5cc489;--warn:#e0a24a;--bad:#ef7480;--inf:#e7a06f;--pri:#6cc3c9;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121c;--surface:#1f1a29;--line:#332c42;--fg:#f0ebf8;--muted:#a79fbc;
  --accent-strong:color-mix(in oklab,var(--accent) 62%,#fff);
  --ok:#5cc489;--warn:#e0a24a;--bad:#ef7480;--inf:#e7a06f;--pri:#6cc3c9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in,.tabs,.main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand>span{display:flex;flex-direction:column}
.app{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.015em;line-height:1.1}
.hi{color:var(--muted);font-size:.85rem}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;flex:none}
.av.big{width:72px;height:72px;font-size:1.6rem}
.tabs{display:flex;gap:2px;padding-block:4px 0;overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.main{padding-block:20px 56px;display:flex;flex-direction:column;gap:24px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:4px}
.muted{color:var(--muted)}.sm{font-size:.85rem}
p{margin:0}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:0;padding:6px 0;color:var(--accent-strong);font-weight:700;cursor:pointer;text-align:left}
.link.bad{color:var(--bad)}
.icon{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;flex:none;font-weight:700}
.icon:disabled{opacity:.3;cursor:default}
.note{padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:.9rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted)}
.day{display:flex;flex-direction:column;gap:6px}
.day-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.day-row input{width:auto}
.day-name{font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.day-name::first-letter{text-transform:uppercase}
.form{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.form .seg{background:var(--bg)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-strong)}
.checks{display:flex;flex-direction:column;gap:4px}
.checks.row{flex-direction:row;flex-wrap:wrap;gap:4px 18px}
.chk{display:flex;align-items:center;gap:9px;min-height:38px;cursor:pointer}
.chk input,.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.assenti{list-style:none;margin:0;padding:0}
.assenti li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.who{font-weight:700}
.assenti .link{margin-left:auto}
.count{color:var(--muted);font-variant-numeric:tabular-nums}.count b{color:var(--fg)}
.meter{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .3s}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slot{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.slot.done{background:var(--surface);border-color:transparent}
.slot-h{display:flex;gap:14px;align-items:flex-start}
.time{font-family:var(--f-display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.15;min-width:3.3em}
.time small,.gt small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted)}
.slot-t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.slot-t .muted{flex-basis:100%}
.cls{font-weight:700;font-size:1.05rem}
.ord{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ord-infanzia{background:var(--inf-soft);color:var(--inf)}
.ord-primaria{background:var(--pri-soft);color:var(--pri)}
.ord-medie{background:var(--accent-soft);color:var(--accent-strong)}
.cands{list-style:none;margin:0;padding:0}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cand-n{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{grid-column:1;display:flex;gap:6px;flex-wrap:wrap}
.cand .btn{grid-column:2;grid-row:1/span 2}
.rec{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-strong);background:var(--accent-soft);padding:2px 7px;border-radius:99px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.t-D{background:var(--ok-soft);color:var(--ok)}
.chip.t-P{background:var(--accent-soft);color:var(--accent-strong)}
.chip.t-R{background:var(--warn-soft);color:var(--warn)}
.assigned{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.assigned b{color:var(--accent-strong)}
.more{align-self:flex-start}
.export{border-top:1px solid var(--line);padding-top:18px}
.docs{list-style:none;margin:0;padding:0}
.doc-row{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.doc-row .ords{display:flex;gap:4px;flex-wrap:wrap}
.doc-row .sm{margin-left:auto;font-variant-numeric:tabular-nums}
.back{align-self:flex-start}
.grid-wrap{overflow-x:auto;margin-inline:-4px;padding:2px}
.grid{border-collapse:separate;border-spacing:4px}
.grid th{font-size:.8rem;color:var(--muted);font-weight:700}
.gt{text-align:left;font-variant-numeric:tabular-nums;padding-right:4px}
.cell{min-width:80px;padding:8px 6px;font-size:.88rem;min-height:40px}
.cell.c-L{background:var(--surface);font-weight:700}
.cell.c-D{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cell.c-P{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.cell.c-R{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.danger{border-top:1px solid var(--line);padding-top:14px}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.av-up{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--accent-strong);font-weight:700}
.grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden;display:block}
.swatch.on{box-shadow:0 0 0 2.5px var(--fg)}
.swatch.custom{background:conic-gradient(#e57373,#ffd54f,#81c784,#64b5f6,#ba68c8,#e57373)}
.swatch.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.crit{list-style:none;margin:0;padding:0;counter-reset:c}
.crit li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);counter-increment:c}
.crit li::before{content:counter(c);font-family:var(--f-display);font-weight:800;color:var(--accent-strong);width:1.1em}
.crit li.off{opacity:.5}
.crit .chk{flex:1}
.mv{display:flex;gap:6px}
.toggles{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tog{display:flex;gap:10px;align-items:center;min-height:42px;cursor:pointer}
.ord-box{border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px}
.ord-box summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.ord-box summary::-webkit-details-marker{display:none}
.ord-box[open]{padding-bottom:12px}
.ord-box .lbl{margin:10px 0 6px}
.fasce,.classi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fasce li,.classi li{display:flex;gap:8px;align-items:center}
.fasce input,.classi input{flex:1;min-width:0;width:auto}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.warn-t{color:var(--warn);font-weight:700;font-size:.9rem}
.reset{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet{position:fixed;inset:0;background:color-mix(in oklab,var(--fg) 40%,transparent);display:grid;place-items:end center;z-index:30;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{background:var(--bg);border-radius:var(--r);padding:16px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.proto{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:180px;width:auto}
.week{display:flex;flex-direction:column;gap:14px}
.wday h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0 0 4px}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.wlist .t{font-variant-numeric:tabular-nums;font-weight:700}
.wlist .w{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted)}
.tag.t-D{background:var(--ok-soft);color:var(--ok)}
.tag.t-P{background:var(--accent-soft);color:var(--accent-strong)}
.tag.t-R{background:var(--warn-soft);color:var(--warn)}
.tag.t-X{background:var(--surface);color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.row2>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip.t-C{background:var(--pri-soft);color:var(--pri)}
.chip.t-B{background:var(--ok-soft);color:var(--ok)}
.chip.t-G{background:var(--surface);color:var(--fg)}
.chip.t-F{background:var(--surface);color:var(--muted)}
.prova{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.presenti{font-size:.88rem;color:var(--pri)}
.fonte{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.chip.t-K{background:var(--warn-soft);color:var(--warn)}
.sync{font-weight:700}
.sync.s-ok{color:var(--ok)}.sync.s-offline,.sync.s-invio,.sync.s-carico{color:var(--warn)}.sync.s-errore{color:var(--bad)}
.login{max-width:420px;margin:8vh auto 0;width:100%}
.login .brand{cursor:default}
.eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;line-height:1.2}
.tab-wrap{overflow-x:auto;margin-inline:-2px}
.rie{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
.rie th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.rie td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rie tr.det td{white-space:normal;background:var(--surface)}
.titolo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.4rem}
.sezioni{max-width:100%;overflow-x:auto;flex-wrap:nowrap}
.sezioni button{white-space:nowrap}
.alunni{list-style:none;margin:0;padding:0}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.al.pieno .al-n{color:var(--bad)}
.al-n{background:none;border:0;padding:6px 0;text-align:left;font-weight:700;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.pallini{display:flex;gap:4px}
.p{width:10px;height:10px;border-radius:50%;background:var(--line)}
.p.on{background:var(--warn)}
.al.pieno .p.on{background:var(--bad)}
.args{list-style:none;margin:0;padding:0}
.args li{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:2px 0}
.args .chk{flex:1;min-width:0}
.args li.fatto .chk span{color:var(--muted);text-decoration:line-through}
.voto{font-family:var(--f-display);font-size:1.1rem;color:var(--accent-strong)}
.sheet-in h2{margin:0}
@media (max-width:420px){.al{grid-template-columns:minmax(0,1fr) auto;}.al .pallini{grid-column:1;grid-row:2}.al .btn{grid-row:1/span 2;grid-column:2}}
.schede{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.scheda{border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.scheda.assente{background:var(--surface);border-color:transparent;opacity:.75}
.sc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-voto{margin-left:auto;font-variant-numeric:tabular-nums}
.punti{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.pt{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.pt small{margin-left:2px}
.pt input{min-height:40px;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.pt.fuori{opacity:.4}
.pin.err{border-color:var(--bad);color:var(--bad)}
.sc-az{display:flex;gap:16px}
.rid{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:10px;padding:10px}
.esedit,.griglia{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.esedit li,.griglia li{display:flex;gap:8px;align-items:center}
.esedit input[type=text]{flex:1;min-width:0;width:auto}
.esedit input[type=number]{width:5.5em}
.griglia input{width:5.5em}
.prog{font-family:var(--f-body);font-size:.95rem;line-height:1.45;field-sizing:content;min-height:5.5em}
.lst{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.pm{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
select.mese{width:auto;min-height:34px;padding:4px 8px;font-size:.8rem}
.misure{display:flex;flex-direction:column;gap:6px;margin-top:8px;color:var(--fg)}
.scad .t{min-width:6em}
.ord-box .checks{padding-bottom:10px}
.promem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--fg)}
</style></head>

<script>

const byNome=(a,b)=>a.nome.localeCompare(b.nome,'it');

const lset=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

/* ---------- Stato ---------- */

  return c.dim.filter(d=>d.alunno===al&&d.data>=Q.da&&d.data<=Q.a&&d.ts>ult).length;
}
function puliscoNomi(txt){
  return txt.split(/\r?\n/).map(r=>r.replace(/^\s*\d+[\.\)\-\s]+/,'').replace(/\t+/g,' ').replace(/\s{2,}/g,' ').trim()).filter(r=>r&&/[a-zà-ü]/i.test(r));
}

/* ---------- Cifratura ---------- */
const te=new TextEncoder(),td=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriva(frase,salt){
  const base=await crypto.subtle.importKey('raw',te.encode(frase.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(salt),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifra(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function decifra(key,iv,ct){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv)},key,ub64(ct))))}
// la chiave resta sul dispositivo (IndexedDB), non estraibile
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('makeiteasy-classi',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function chiaveGet(id){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('k').objectStore('k').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function chiaveSet(id,k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('k','readwrite');k?t.objectStore('k').put(k,id):t.objectStore('k').delete(id);t.oncomplete=res;t.onerror=res})}catch(e){}}

/* ---------- Sincronizzazione ---------- */
const LINK='makeiteasy.classi.cloud',SALT='makeiteasy.classi.salt';
const CLOUD={on:false,user:null,ready:false,stato:'',err:'',ref:null,unsub:null,key:null,remote:null,scelta:null,deferred:false,loginErr:'',fraseErr:'',lavoro:false};
const STATO={ok:'Sincronizzato',invio:'Sto sincronizzando…',offline:'Offline: sincronizzo appena torna la rete',carico:'Scarico i dati…',errore:'Errore di sincronizzazione'};
function cloudInit(){
  try{
    if(typeof firebaseConfig==='undefined'||!window.firebase||!firebaseConfig.apiKey||/INCOLLA/.test(firebaseConfig.apiKey))return;
    CLOUD.on=true;firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    firebase.auth().onAuthStateChanged(async u=>{
      CLOUD.user=u;if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}
      CLOUD.key=u?await chiaveGet(u.uid):null;CLOUD.ready=true;CLOUD.remote=null;
      if(u){CLOUD.stato='carico';CLOUD.ref=db.collection('classi').doc(u.uid);
        CLOUD.unsub=CLOUD.ref.onSnapshot({includeMetadataChanges:true},snap=>{onRemote(snap)},err=>{CLOUD.stato='errore';CLOUD.err=err.message;render()})}
      render();
    });
  }catch(e){CLOUD.on=false}
}
async function onRemote(snap){
  CLOUD.stato=snap.metadata.hasPendingWrites?'invio':snap.metadata.fromCache?'offline':'ok';
  const linked=lget(LINK)===CLOUD.user.uid;
  if(!snap.exists){
    if(snap.metadata.fromCache&&!linked){safeRender();return}
    CLOUD.remote={vuoto:true};
    if(CLOUD.key){lset(LINK,CLOUD.user.uid);pushNow()}
    safeRender();return;
  }
  const r=snap.data();CLOUD.remote=r;
  if(!CLOUD.key){render();return}
  if(snap.metadata.hasPendingWrites)return;
  let n;try{n=await decifra(CLOUD.key,r.iv,r.ct)}catch(e){CLOUD.key=null;await chiaveSet(CLOUD.user.uid,null);CLOUD.fraseErr='La frase segreta salvata non apre più i dati: inseriscila di nuovo.';render();return}
  if(!n||n.v!==1){safeRender();return}
  if(!linked){
    const ha=S.classi.some(c=>c.alunni.length||c.argomenti.length||c.agenda.length);
    if(ha&&JSON.stringify(n)!==JSON.stringify(S)){CLOUD.scelta=n;render();return}
    S=n;lset(KEY,JSON.stringify(S));lset(LINK,CLOUD.user.uid);render();return;
  }
  if(r.mod&&(!S.mod||r.mod>S.mod)){S=n;lset(KEY,JSON.stringify(S));safeRender()}
  else if(S.mod&&(!r.mod||S.mod>r.mod))pushNow();
  else safeRender();
}
let pushT;function pushLater(){clearTimeout(pushT);pushT=setTimeout(pushNow,600)}
async function pushNow(){
  if(!CLOUD.ref||!CLOUD.key)return;if(!S.mod)S.mod=new Date().toISOString();
  const mio=CLOUD.salt||lget(SALT);
  if(CLOUD.remote&&CLOUD.remote.salt&&mio&&CLOUD.remote.salt!==mio){CLOUD.key=null;await chiaveSet(CLOUD.user.uid,null);CLOUD.fraseErr='La frase segreta è stata cambiata su un altro dispositivo: inseriscila di nuovo.';render();return}
  try{const {iv,ct}=await cifra(CLOUD.key,S);
    await CLOUD.ref.set({v:1,salt:CLOUD.salt||lget(SALT)||CLOUD.remote?.salt,iv,ct,mod:S.mod})}
  catch(e){CLOUD.stato='errore';CLOUD.err=e.message||String(e);render()}
}
async function backupCifrato(){
  if(!CLOUD.key){toast('Serve l\'accesso con la frase segreta');return}
  const {iv,ct}=await cifra(CLOUD.key,S);
  const dati=JSON.stringify({app:'makeiteasy-classi',cifrato:1,v:1,salt:CLOUD.salt||lget(SALT),iv,ct,creato:new Date().toISOString()});
  const ok=await salvaFile(`classi-backup-cifrato-${iso(new Date())}.json`,new Blob([dati],{type:'application/json'}));
  if(ok!==false){S.ultimoBackup=iso(new Date());save();render()}
}
async function apriBackupCifrato(){
  const f=val('bkFrase');const b=ui.bkCifrato;CLOUD.fraseErr='';
  try{const k=await deriva(f,b.salt);const n=await decifra(k,b.iv,b.ct);if(n.v!==1||!Array.isArray(n.classi))throw 0;
    ui.bkPronto=n;ui.bkCifrato=null;ui.conferma='impC';render()}
  catch(e){toast('Frase sbagliata per questo backup')}
}
async function cambiaFrase(){
  const vecchia=val('cfOld'),n1=val('cfNew1'),n2=val('cfNew2');
  if(n1.length<10){toast('La nuova frase deve avere almeno 10 caratteri');return}
  if(n1!==n2){toast('Le due nuove frasi non sono uguali');return}
  ui.lavoro=true;render();
  try{const salt=CLOUD.salt||lget(SALT);const kOld=await deriva(vecchia,salt);
    if(CLOUD.remote&&CLOUD.remote.ct)await decifra(kOld,CLOUD.remote.iv,CLOUD.remote.ct);
    const ns=b64(crypto.getRandomValues(new Uint8Array(16)));const k=await deriva(n1,ns);
    CLOUD.key=k;CLOUD.salt=ns;lset(SALT,ns);await chiaveSet(CLOUD.user.uid,k);CLOUD.remote={...(CLOUD.remote||{}),salt:ns};
    ui.lavoro=false;ui.conferma=null;save();await pushNow();toast('Frase cambiata. Sugli altri dispositivi ti verrà chiesta la nuova.');render();
  }catch(e){ui.lavoro=false;toast('La frase attuale non è corretta');render()}
}
function nuovoAnno(tieni){
  const piu=d=>d?(+d.slice(0,4)+1)+d.slice(4):d;
  S.quad.forEach(q=>{q.da=piu(q.da);q.a=piu(q.a)});
  for(const c of S.classi){c.dim=[];c.voti=[];c.verifiche=[];c.agenda=[];c.prog={ann:c.prog?.ann||{},mesi:{}};
    c.argomenti.forEach(a=>{a.fatto=null;a.mese=piu(a.mese)});
    if(!tieni)c.alunni=[];else c.alunni.forEach(a=>{if(a.piano){a.piano.oss=[];a.piano.scad=scadStd(a.piano.tipo);a.piano.fatte={}}})}
  if(!tieni)S.classi.forEach(c=>c.alunni.forEach(a=>a.piano&&delete a.piano));
}
async function impostaFrase(nuova){
  const f1=document.getElementById('f1')?.value||'',f2=document.getElementById('f2')?.value||'';
  CLOUD.fraseErr='';
  if(nuova){
    if(f1.length<10){CLOUD.fraseErr='Usa almeno 10 caratteri: meglio una frase di 3-4 parole.';render();return}
    if(f1!==f2){CLOUD.fraseErr='Le due frasi non sono uguali.';render();return}
    CLOUD.lavoro=true;render();
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));CLOUD.salt=salt;lset(SALT,salt);
    const k=await deriva(f1,salt);CLOUD.key=k;await chiaveSet(CLOUD.user.uid,k);lset(LINK,CLOUD.user.uid);
    CLOUD.lavoro=false;save();await pushNow();render();return;
  }
  const r=CLOUD.remote;if(!r||!r.salt)return;
  CLOUD.lavoro=true;render();
  try{const k=await deriva(f1,r.salt);const n=await decifra(k,r.iv,r.ct);
    CLOUD.key=k;CLOUD.salt=r.salt;lset(SALT,r.salt);await chiaveSet(CLOUD.user.uid,k);CLOUD.lavoro=false;
    const ha=S.classi.some(c=>c.alunni.length||c.argomenti.length||c.agenda.length);
    if(lget(LINK)!==CLOUD.user.uid&&ha&&JSON.stringify(n)!==JSON.stringify(S)){CLOUD.scelta=n;render();return}
    S=n;lset(KEY,JSON.stringify(S));lset(LINK,CLOUD.user.uid);render();
  }catch(e){CLOUD.lavoro=false;CLOUD.fraseErr='Frase segreta sbagliata.';render()}
}
function safeRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&!['checkbox','file','button'].includes(a.type)))){CLOUD.deferred=true;return}
  render();
}

};
const MIS_VER=['tempi','ridotte','strutturate','orale','strumenti','consegneLette','griglia'];
function annoBase(){return +S.quad[0].da.slice(0,4)}
function scadStd(tipo){const y=annoBase();return tipo==='PEI'?{stesura:`${y}-10-31`,intermedia:`${y+1}-02-28`,finale:`${y+1}-06-30`}:{stesura:`${y}-11-30`,intermedia:`${y+1}-02-15`,finale:`${y+1}-06-15`}}
function pianoNuovo(tipo){return {tipo,motivo:tipo==='PDP'?'DSA':'',comp:[],disp:[],val:[],obiettivi:'',strategie:'',note:'',oss:[],scad:scadStd(tipo)}}
const NOMI_SCAD={stesura:'Stesura',intermedia:'Verifica intermedia',finale:'Verifica finale'};
function misureVerifica(p){const m=[];for(const k of MIS_VER)if((p.val||[]).includes(k))m.push(PCHK.val[1].find(x=>x[0]===k)[1]);if((p.comp||[]).length&&!m.some(x=>/strumenti/.test(x))&&(p.val||[]).includes('strumenti'))m.push('strumenti compensativi');return m}
function scadenzeVicine(){const oggi=iso(new Date());const lim=iso(new Date(Date.now()+30*864e5));const out=[];
  for(const c of S.classi)for(const a of c.alunni){if(!a.piano)continue;for(const [k,d] of Object.entries(a.piano.scad||{})){if(!d||(a.piano.fatte||{})[k])continue;
    if(d<=lim&&d>=iso(new Date(Date.now()-14*864e5)))out.push({data:d,giorni:d<oggi?-1:1,tipo:a.piano.tipo,cosa:NOMI_SCAD[k],alunno:a.nome,classe:nomeClasse(c),cid:c.id,aid:a.id})}}
  return out.sort((x,y)=>x.data.localeCompare(y.data));}
const nomeDoc=a=>S.soloIniziali?a.nome.split(/\s+/).map(w=>w[0]?.toUpperCase()+'.').join(' '):a.nome;
function voci(p,g){return (p[g]||[]).map(k=>PCHK[g][1].find(x=>x[0]===k)?.[1]).filter(Boolean)}
function testoPiano(c,a,pieno){
  const p=a.piano;const mat=c.materia||'la disciplina';const L=[];
  L.push(`# ${p.tipo}${p.motivo?' ('+p.motivo+')':''} – ${nomeDoc(a)} – classe ${c.nome} ${ORDINI[c.ordine]||''}`);
  if(pieno){L.push('## Dati e situazione di partenza','(da compilare: dati dell\'alunno, documentazione, profilo di funzionamento)','## Strategie generali del consiglio di classe','(da compilare)')}
  L.push(`## ${pieno?'Disciplina: ':'Contributo per la disciplina: '}${mat}`);
  if(p.obiettivi.trim())L.push('Obiettivi:',p.obiettivi.trim());
  if(p.strategie.trim())L.push('Strategie didattiche:',p.strategie.trim());
  for(const g of ['comp','disp','val']){const v=voci(p,g);if(v.length)L.push(PCHK[g][0]+':',...v.map(x=>'- '+x[0].toUpperCase()+x.slice(1)))}
  if(p.note.trim())L.push('Note:',p.note.trim());
  if(pieno)L.push('## Altre discipline','(da compilare a cura dei docenti del consiglio di classe)','## Patto con la famiglia','(da compilare)');
  return L.join('\n');
}

    else if(r.startsWith('## '))x+=par(r.slice(3),'Heading1');else if(/:$/.test(r))x+=par(r.slice(0,-1),'Heading2');else x+=testo(r)}
  const a2=a.piano;if(a2.oss.length&&ui.ossWord){x+=par('Osservazioni durante l\'anno','Heading1');a2.oss.forEach(o=>x+=par('• '+dBreve(o.data)+': '+o.testo,'Elenco'))}

}

const meseCorrente=()=>{const k=iso(new Date()).slice(0,7);const ms=mesiAnno();return ms.includes(k)?k:ms[0]};

const val=id=>document.getElementById(id)?.value??'';
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const A=b.dataset.act,v=b.dataset.v;const c=ui.classe&&classe(ui.classe);
  switch(A){
    case 'tab':ui.tab=v;ui.conferma=null;if(v==='classi'){ui.classe=null;ui.alunno=null}window.scrollTo(0,0);break;
    case 'apri':ui.classe=v;ui.sez='alunni';ui.alunno=null;ui.paste=false;window.scrollTo(0,0);break;
    case 'indietro':ui.classe=null;ui.alunno=null;break;
    case 'sez':ui.sez=v;ui.alunno=null;ui.piano=null;ui.ver=null;break;
    case 'conf':ui.conferma=v||null;break;
    case 'addClasse':{const n=val('ncNome').trim();if(!n){toast('Scrivi il nome della classe');return}
      S.classi.push({id:uid(),nome:n,ordine:val('ncOrd'),materia:val('ncMat').trim(),alunni:[],agenda:[],dim:[],voti:[],argomenti:[],verifiche:[]});ui.conferma=null;save();break}
    case 'rmClasse':S.classi=S.classi.filter(x=>x.id!==v);ui.conferma=null;save();break;
    case 'paste':ui.paste=v==='1';break;
    case 'addAlunni':{const nomi=puliscoNomi(val('paste'));if(!nomi.length){toast('Non trovo nomi nel testo incollato');return}
      const gia=new Set(c.alunni.map(a=>a.nome.toLowerCase()));let n=0;
      for(const x of nomi)if(!gia.has(x.toLowerCase())){c.alunni.push({id:uid(),nome:x});gia.add(x.toLowerCase());n++}
      ui.paste=false;save();toast(n===1?'Aggiunto 1 alunno':`Aggiunti ${n} alunni`);break}
    case 'alunno':ui.alunno=v||null;ui.conferma=null;window.scrollTo(0,0);break;
    case 'dim':{c.dim.push({id:uid(),alunno:v,data:ui.data,ts:new Date().toISOString()});save();
      const n=contatore(c,v,ui.data);if(n>=S.soglia)ui.proposta={classe:c.id,alunno:v,data:ui.data,n};else toast('Segnato');break}
    case 'undoDim':{const x=c.dim.filter(d=>d.alunno===v&&d.data===ui.data).sort((a,b)=>a.ts.localeCompare(b.ts)).pop();if(x){c.dim=c.dim.filter(d=>d.id!==x.id);save();toast('Tolta la dimenticanza di oggi')}break}
    case 'cinque':{const p=ui.proposta;const cc=classe(p.classe);const ts=new Date().toISOString();
      cc.voti.push({id:uid(),alunno:p.alunno,data:p.data,voto:'5',motivo:`${p.n} compiti dimenticati`,daDim:true,ts});
      const ult=cc.dim.filter(d=>d.alunno===p.alunno).sort((a,b)=>a.ts.localeCompare(b.ts)).pop();if(ult)ult.voto=true;
      ui.proposta=null;save();toast('5 registrato: il conteggio riparte da zero');break}
    case 'noCinque':ui.proposta=null;break;
    case 'rmDim':{const cc=classe(ui.classe);cc.dim=cc.dim.filter(d=>d.id!==v);save();break}
    case 'addVer':{const t=val('nvT').trim()||'Verifica';const n=Math.max(1,Math.min(30,parseInt(val('nvN'))||1));const pt=num(val('nvP'))||10;
      const vf={id:uid(),titolo:t,data:val('nvD')||iso(new Date()),esercizi:Array.from({length:n},(_,i)=>({id:uid(),nome:'Es. '+(i+1),max:pt})),punti:{},rid:{},assenti:[]};
      c.verifiche.push(vf);ui.conferma=null;ui.ver=vf.id;ui.verEdit=false;save();window.scrollTo(0,0);break}
    case 'apriVer':ui.ver=v;ui.verEdit=false;ui.ridAl=null;window.scrollTo(0,0);break;
    case 'chiudiVer':ui.ver=null;ui.verEdit=false;break;
    case 'verEdit':ui.verEdit=!ui.verEdit;break;
    case 'addEs':{const vf=c.verifiche.find(x=>x.id===ui.ver);const last=vf.esercizi[vf.esercizi.length-1];vf.esercizi.push({id:uid(),nome:'Es. '+(vf.esercizi.length+1),max:last?last.max:10});save();break}
    case 'rmEs':{const vf=c.verifiche.find(x=>x.id===ui.ver);vf.esercizi=vf.esercizi.filter(x=>x.id!==v);save();break}
    case 'rmVer':c.verifiche=c.verifiche.filter(x=>x.id!==ui.ver);c.voti=c.voti.filter(x=>x.verifica!==ui.ver);ui.ver=null;ui.conferma=null;save();break;
    case 'assente':{const vf=c.verifiche.find(x=>x.id===ui.ver);vf.assenti=vf.assenti||[];vf.assenti=vf.assenti.includes(v)?vf.assenti.filter(x=>x!==v):[...vf.assenti,v];save();break}
    case 'ridAl':ui.ridAl=ui.ridAl===v?null:v;break;
    case 'regVer':{const vf=c.verifiche.find(x=>x.id===ui.ver);let n=0;
      for(const a of c.alunni){if((vf.assenti||[]).includes(a.id))continue;const e=esito(vf,a.id);if(!e.completo)continue;
        const ex=c.voti.find(x=>x.verifica===vf.id&&x.alunno===a.id);const mot=vf.titolo+(e.ridotta?' (ridotta)':'');
        if(ex){if(ex.voto!==e.voto){ex.voto=e.voto;ex.registro=false}ex.motivo=mot;ex.data=vf.data}
        else c.voti.push({id:uid(),alunno:a.id,data:vf.data,voto:e.voto,motivo:mot,verifica:vf.id,ts:new Date().toISOString()});n++}
      vf.registrati=true;save();toast(`${n} voti registrati: li trovi in Voti`);break}
    case 'gAdd':S.griglia.push({min:0,voto:''});save();break;
    case 'gRm':S.griglia.splice(+b.dataset.i,1);save();break;
    case 'gStd':S.griglia=grigliaStd();ui.conferma=null;save();break;
    case 'rmVoto':c.voti=c.voti.filter(x=>x.id!==v);save();break;
    case 'regOk':{const x=c.voti.find(y=>y.id===v);if(x)x.registro=true;save();break}
    case 'rmAlunno':{const id=ui.alunno;c.alunni=c.alunni.filter(a=>a.id!==id);c.dim=c.dim.filter(d=>d.alunno!==id);c.voti=c.voti.filter(x=>x.alunno!==id);ui.alunno=null;ui.conferma=null;save();break}
    case 'agTipo':ui.agTipo=v;ui.agData=val('agData');break;
    case 'addAg':{const t=val('agTesto').trim(),d=val('agData');if(!t||!d){toast('Scrivi la data e cosa devono fare');return}
      c.agenda.push({id:uid(),tipo:ui.agTipo||'compito',data:d,testo:t});ui.agData=d;save();toast('Aggiunto');break}
    case 'rmAg':c.agenda=c.agenda.filter(x=>x.id!==v);save();break;
    case 'agTutti':ui.agTutti=true;break;
    case 'addArg':{const r=val('argNew').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!r.length)return;const m=val('argMeseNew')||null;r.forEach(t=>c.argomenti.push({id:uid(),testo:t,fatto:null,mese:m}));save();break}
    case 'apriPiano':ui.tab='classi';ui.classe=b.dataset.c;ui.sez='piani';ui.piano=v;ui.alunno=null;ui.ver=null;window.scrollTo(0,0);break;
    case 'piano':ui.piano=v||null;ui.conferma=null;window.scrollTo(0,0);break;
    case 'nuovoPiano':{const a=c.alunni.find(x=>x.id===val('npAl'));if(!a)return;const tipo=val('npTipo')||'PDP';a.piano=pianoNuovo(tipo);a.bes=true;ui.piano=a.id;ui.conferma=null;save();break}
    case 'pTipo':{const a=c.alunni.find(x=>x.id===ui.piano);a.piano.tipo=v;a.piano.scad=scadStd(v);save();break}
    case 'pMot':{const a=c.alunni.find(x=>x.id===ui.piano);a.piano.motivo=v;save();break}
    case 'rmPiano':{const a=c.alunni.find(x=>x.id===ui.piano);delete a.piano;a.bes=false;ui.piano=null;ui.conferma=null;save();break}
    case 'addOss':{const a=c.alunni.find(x=>x.id===ui.piano);const t=val('ossNew').trim();if(!t)return;a.piano.oss.push({id:uid(),data:iso(new Date()),testo:t});save();toast('Osservazione salvata');break}
    case 'rmOss':{const a=c.alunni.find(x=>x.id===ui.piano);a.piano.oss=a.piano.oss.filter(o=>o.id!==v);save();break}
    case 'copiaPiano':{const a=c.alunni.find(x=>x.id===ui.piano);copia(testoPiano(c,a,!!ui.pieno).replace(/^#+ /gm,''),'Testo copiato');return}
    case 'wordPiano':{const a=c.alunni.find(x=>x.id===ui.piano);wordPiano(c,a);return}
    case 'pieno':ui.pieno=!ui.pieno;break;
    case 'progVista':ui.progVista=v;break;
    case 'apriG':e.preventDefault();ui.apri=ui.apri===v?null:v;break;
    case 'progBozza':{const k=b.dataset.k;c.prog.ann[k]=bozza(c,k);save();break}
    case 'wordAnn':wordAnnuale(c);return;
    case 'wordMese':wordMese(c,ui.progMese||meseCorrente());return;
    case 'rmArg':c.argomenti=c.argomenti.filter(x=>x.id!==v);save();break;
    case 'addVoto':{const vt=val('vVoto').trim();if(!vt){toast('Scrivi il voto');return}
      c.voti.push({id:uid(),alunno:val('vAl'),data:val('vData')||iso(new Date()),voto:vt,motivo:val('vMot').trim(),ts:new Date().toISOString()});save();toast('Voto aggiunto');break}
    case 'copiaVoti':{const nr=c.voti.filter(x=>!x.registro).sort((a,b)=>a.data.localeCompare(b.data));
      copia(`Voti da riportare – ${nomeClasse(c)}\n\n`+(nr.length?nr.map(x=>`${dBreve(x.data)} · ${c.alunni.find(a=>a.id===x.alunno)?.nome||''} · ${x.voto}${x.motivo?' ('+x.motivo+')':''}`).join('\n'):'Nessun voto da riportare'),'Voti copiati');return}
    case 'color':S.profilo.accento=v;save();break;
    case 'bkCifrato':backupCifrato();return;
    case 'bkApri':apriBackupCifrato();return;
    case 'bkAnnulla':ui.bkCifrato=null;ui.bkPronto=null;ui.conferma=null;break;
    case 'bkRipristina':S=migra(ui.bkPronto);ui.bkPronto=null;ui.conferma=null;ui.classe=null;save();toast('Backup ripristinato');break;
    case 'cambiaFrase':cambiaFrase();return;
    case 'nuovoAnno':{const tieni=!!document.getElementById('tieniAl')?.checked;
      (async()=>{if(CLOUD.key){const ok=await backupCifrato();}nuovoAnno(tieni);ui.conferma=null;ui.classe=null;save();toast('Nuovo anno iniziato');render()})();return}
    case 'bkCopy':copia(JSON.stringify(S),'Backup copiato');return;
    case 'bkDl':scarica(`make-it-easy-classi-backup-${iso(new Date())}.json`,JSON.stringify(S),'application/json');return;
    case 'bkImp':{try{const n=JSON.parse(ui.importTxt);if(n.v!==1||!Array.isArray(n.classi))throw 0;S=n;ui.importTxt='';ui.conferma=null;save();toast('Backup importato')}catch(_){ui.conferma=null;toast('Questo testo non è un backup di Classi')}break}
    case 'closeCopy':ui.copia=null;break;
    case 'pwReset':{const em=val('lEmail').trim();if(!em){CLOUD.loginErr='Scrivi prima la tua email.';render();return}
      firebase.auth().sendPasswordResetEmail(em).then(()=>toast('Ti ho mandato un\'email per cambiare password')).catch(()=>toast('Non riesco a mandare l\'email: controlla l\'indirizzo'));return}
    case 'tieniOnline':S=CLOUD.scelta;CLOUD.scelta=null;lset(KEY,JSON.stringify(S));lset(LINK,CLOUD.user.uid);break;
    case 'tieniLocale':CLOUD.scelta=null;lset(LINK,CLOUD.user.uid);save();pushNow();break;
    case 'esci':{ui.conferma=null;const u=CLOUD.user;chiaveSet(u?.uid,null).then(()=>firebase.auth().signOut()).then(()=>{lset(KEY,null);lset(LINK,null);lset(SALT,null);location.reload()});return}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;const C=t.dataset.chg;if(!C)return;const c=ui.classe&&classe(ui.classe);
  switch(C){
    case 'data':if(t.value)ui.data=t.value;break;
    case 'aNome':{const a=c.alunni.find(x=>x.id===ui.alunno);if(a&&t.value.trim()){a.nome=t.value.trim();save()}break}
    case 'argOn':{const a=c.argomenti.find(x=>x.id===t.dataset.v);if(a){a.fatto=t.checked?iso(new Date()):null;save()}break}
    case 'bes':{const a=c.alunni.find(x=>x.id===t.dataset.al);if(a){a.bes=t.checked;save()}break}
    case 'rid':{const vf=c.verifiche.find(x=>x.id===ui.ver);vf.rid=vf.rid||{};const r=vf.rid[t.dataset.al]||[];
      vf.rid[t.dataset.al]=t.checked?r.filter(x=>x!==t.dataset.v):[...r,t.dataset.v];if(!vf.rid[t.dataset.al].length)delete vf.rid[t.dataset.al];save();break}
    case 'veT':{const vf=c.verifiche.find(x=>x.id===ui.ver);if(t.value.trim()){vf.titolo=t.value.trim();save()}break}
    case 'veD':{const vf=c.verifiche.find(x=>x.id===ui.ver);if(t.value){vf.data=t.value;save()}break}
    case 'esNome':{const vf=c.verifiche.find(x=>x.id===ui.ver);const e=vf.esercizi.find(x=>x.id===t.dataset.v);if(e&&t.value.trim()){e.nome=t.value.trim();save()}break}
    case 'esMax':{const vf=c.verifiche.find(x=>x.id===ui.ver);const e=vf.esercizi.find(x=>x.id===t.dataset.v);const n=num(t.value);if(e&&n!=null&&n>0){e.max=n;save()}break}
    case 'gMin':{const n=num(t.value);if(n!=null){S.griglia[+t.dataset.i].min=n;save()}break}
    case 'gVoto':S.griglia[+t.dataset.i].voto=t.value.trim();save();break;
    case 'soglia':S.soglia=+t.value;save();break;
    case 'qda':if(t.value){S.quad[+t.dataset.i].da=t.value;save()}break;
    case 'qa':if(t.value){S.quad[+t.dataset.i].a=t.value;save()}break;
    case 'pChk':{const a=c.alunni.find(x=>x.id===ui.piano);const g=t.dataset.g;const L=a.piano[g]=a.piano[g]||[];a.piano[g]=t.checked?[...new Set([...L,t.value])]:L.filter(x=>x!==t.value);save();return}
    case 'pTxt':{const a=c.alunni.find(x=>x.id===ui.piano);a.piano[t.dataset.k]=t.value;save();return}
    case 'pScad':{const a=c.alunni.find(x=>x.id===ui.piano);a.piano.scad[t.dataset.k]=t.value;save();break}
    case 'coord':c.coord=t.checked;save();break;
    case 'iniz':S.soloIniziali=t.checked;save();return;
    case 'ossWord':ui.ossWord=t.checked;return;
    case 'pScuola':S.scuola=t.value.trim();save();return;
    case 'argMese':{const a=c.argomenti.find(x=>x.id===t.dataset.v);if(a){a.mese=t.value||null;save()}return}
    case 'progT':{const k=t.dataset.k,m=t.dataset.m;if(m){c.prog.mesi[m]=c.prog.mesi[m]||{};c.prog.mesi[m][k]=t.value}else c.prog.ann[k]=t.value;save();return}
    case 'progMese':ui.progMese=t.value;break;
    case 'pNome':S.profilo.nome=t.value.trim();save();break;
    case 'pCol':S.profilo.accento=t.value;save();break;
    case 'foto':{const f=t.files[0];if(!f)return;resizeImg(f).then(u=>{S.profilo.foto=u;save();render()}).catch(()=>toast('Non riesco a leggere questa immagine'));return}
    case 'bkTxt':ui.importTxt=t.value;break;
    case 'bkFile':{const f=t.files[0];if(!f)return;f.text().then(x=>{let j=null;try{j=JSON.parse(x)}catch(e){}
      if(j&&j.cifrato&&j.ct){ui.bkCifrato=j;ui.conferma=null}else if(j&&j.v===1&&Array.isArray(j.classi)){ui.bkPronto=j;ui.conferma='impC'}else toast('Questo file non è un backup di Classi');render()});return}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.classList&&t.classList.contains('pin')){const c=classe(ui.classe);const vf=c?.verifiche.find(x=>x.id===ui.ver);if(!vf)return;
    vf.punti=vf.punti||{};const p=vf.punti[t.dataset.al]=vf.punti[t.dataset.al]||{};const raw=t.value.trim();
    const es=vf.esercizi.find(x=>x.id===t.dataset.es);const n=num(raw);t.classList.toggle('err',raw!==''&&(n==null||n<0||n>es.max));
    if(raw==='')delete p[t.dataset.es];else p[t.dataset.es]=raw;aggiornaScheda(c,vf,t.dataset.al);saveLater();return}if(e.target.id==='pCol')document.documentElement.style.setProperty('--accent',e.target.value);if(e.target.id==='bkTxt')ui.importTxt=e.target.value});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
cloudInit();
render();

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
